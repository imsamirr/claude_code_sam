name: Apply tracking updates to Google Sheet

on:
  push:
    paths:
      - 'tracking-updates/queue/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-tracking-updates
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread==5.12.0 google-auth==2.23.4

      - name: Apply queued updates
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ vars.SHEET_ID || '1D-FIUSN5BsLL7JIMSnvcjNWREPm3qxkbj6BfjPud4Rk' }}
          SHEET_TAB: ${{ vars.SHEET_TAB || 'Sheet1' }}
        run: python scripts/apply_tracking_updates.py

      - name: Commit applied files
        run: |
          if [ -n "$(git status --porcelain tracking-updates/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tracking-updates/
            git commit -m "Mark tracking updates as applied"
            git push
          fi
