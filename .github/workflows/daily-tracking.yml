# Required secrets:
#   GOOGLE_SA_JSON   service-account JSON with Editor on the sheet
#
# Optional secrets (set if you want the workflow to post to Slack directly,
# instead of letting the Claude trigger handle it):
#   SLACK_BOT_TOKEN  xoxb-... token for a Slack bot that's a member of
#                    #team-order-tracking-updates, with scopes:
#                      chat:write    — post the daily message
#                      files:write   — attach the action-lists CSV
#
# Optional repo variables (override the inline defaults below):
#   SHEET_ID, SHEET_TAB, SLACK_CHANNEL_ID

name: Daily tracking refresh and Slack report

on:
  schedule:
    - cron: '0 13 * * *'  # 13:00 UTC daily = 08:00 ET (winter) / 09:00 ET (summer)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip sheet writes'
        type: boolean
        default: false

permissions:
  contents: write  # to commit the daily report files

concurrency:
  group: daily-tracking
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Need a real ref so the post-job commit can push back to the branch.
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread==5.12.0 google-auth==2.23.4 requests==2.31.0

      - name: Run daily tracking job
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ vars.SHEET_ID || '1D-FIUSN5BsLL7JIMSnvcjNWREPm3qxkbj6BfjPud4Rk' }}
          SHEET_TAB: ${{ vars.SHEET_TAB || '2026 ORDERS' }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID || 'C04PZVBS9GA' }}
          LOOKUP_DELAY: '0.4'
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python scripts/daily_tracking_job.py

      - name: Commit daily report artifacts
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracking-updates/daily-reports/
          if git diff --cached --quiet; then
            echo "no daily report files to commit"
            exit 0
          fi
          today=$(date -u +%Y-%m-%d)
          git commit -m "Daily tracking report — $today"
          # Retry push with backoff in case of concurrent pushes
          for delay in 2 4 8 16; do
            if git push origin "${GITHUB_REF#refs/heads/}"; then
              exit 0
            fi
            echo "push failed, retrying in ${delay}s..."
            sleep "$delay"
            git pull --rebase origin "${GITHUB_REF#refs/heads/}"
          done
          git push origin "${GITHUB_REF#refs/heads/}"
