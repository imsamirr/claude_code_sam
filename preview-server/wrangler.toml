name = "divine-gifts-preview"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Image decoding/watermarking needs more CPU than the free plan's 10 ms,
# so this Worker requires the Workers Paid plan ($5/month).
[limits]
cpu_ms = 30000

[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

[[r2_buckets]]
binding = "ART"
bucket_name = "divine-gifts-art"

[[kv_namespaces]]
binding = "RATE"
# Replaced with the real namespace id at first deploy (see HANDOFF.md).
id = "00000000000000000000000000000000"

[vars]
ALLOWED_ORIGINS = "https://reclaimnutra.com,https://www.reclaimnutra.com,https://ff0c5a-21.myshopify.com"
DAILY_LIMIT = "6"
OPENAI_IMAGE_MODEL = "gpt-image-1"
OPENAI_IMAGE_QUALITY = "medium"
OPENAI_INPUT_FIDELITY = "high"
PREVIEW_WIDTH = "768"

# Secrets (set with `wrangler secret put`, never committed):
#   OPENAI_API_KEY  – the Divine Gifts OpenAI project key
#   ADMIN_TOKEN     – long random string for the /admin/* download endpoints
