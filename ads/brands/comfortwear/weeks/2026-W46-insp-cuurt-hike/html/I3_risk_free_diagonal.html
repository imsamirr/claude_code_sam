<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;position:relative;font-family:Inter;background:#F4F1EA}
.a{position:absolute;inset:0;background:#BFDDF0;clip-path:polygon(0 0,62% 0,38% 100%,0 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.55) 3px,transparent 3px),linear-gradient(90deg,rgba(255,255,255,.55) 3px,transparent 3px);background-size:180px 180px;clip-path:polygon(0 0,62% 0,38% 100%,0 100%)}

.shoe{position:absolute;left:0px;top:490px;width:650px;filter:drop-shadow(0 30px 26px rgba(0,0,0,.28));z-index:2}
.h{position:absolute;right:76px;top:100px;display:flex;flex-direction:column;align-items:flex-end;gap:10px;z-index:3}
.h span{background:#fff;color:#111;font:900 74px/1.05 Inter;padding:4px 18px;letter-spacing:-1px;box-shadow:0 6px 20px rgba(0,0,0,.06)}
.pills{position:absolute;right:76px;top:580px;display:flex;flex-direction:column;gap:18px;align-items:flex-end;z-index:3}
.pill{background:#fff;border:3px solid #111;border-radius:26px;padding:16px 22px;display:flex;align-items:center;gap:16px;font:800 27px/1.2 Inter;color:#111;width:420px}
.pill i{flex:0 0 52px;height:52px;border-radius:50%;background:#111;color:#fff;font:900 26px/52px Inter;text-align:center;font-style:normal}
.cta{position:absolute;right:76px;bottom:96px;background:#111;color:#fff;font:900 30px/1.25 Inter;padding:26px 40px;border-radius:60px;text-align:center;z-index:3}

<div class="a"></div><div class="grid"></div>
<img class="shoe" src="../scenes/navy_diag.png">
<div class="h"><span>Hate them?</span><span>Send them back.</span><span>Full refund</span><span>in 30 days.</span></div>
<div class="pills">
 <div class="pill"><i>↔</i>Wide toe box + arch support</div>
 <div class="pill"><i>◡</i>Cushioned rocker sole</div>
 <div class="pill"><i>✓</i>30-day money-back guarantee</div>
</div>
<div class="cta">TRY THEM RISK-FREE<br>40% OFF + FREE SHIPPING</div>
</body></html>
