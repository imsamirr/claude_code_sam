<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;position:relative;font-family:Inter,-apple-system,sans-serif}
.bg{position:absolute;inset:0;background:url(../scenes/P2_closeup.png) center/cover;transform:scale(1.09);transform-origin:50% 40%}
.note{position:absolute;left:76px;right:76px;top:120px;background:rgba(255,255,255,.72);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:44px;padding:30px 34px;box-shadow:0 18px 50px rgba(0,0,0,.18)}
.top{display:flex;align-items:center;gap:14px;color:#6b6b6b;font:600 24px Inter;letter-spacing:.5px}
.icon{width:46px;height:46px;border-radius:12px;background:linear-gradient(#5BF675,#2CD34A);display:flex;align-items:center;justify-content:center}
.icon:after{content:'';width:26px;height:20px;background:#fff;border-radius:50%}
.top .t{margin-left:auto}
.from{font:700 34px Inter;color:#111;margin:18px 0 6px}
.msg{font:500 34px/1.32 Inter;color:#1c1c1c}
.cta{position:absolute;left:76px;top:1166px;background:rgba(30,58,47,.92);color:#fff;font:600 34px Inter;padding:24px 48px;border-radius:60px;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.offer{position:absolute;right:76px;top:1164px;text-align:right;background:rgba(255,255,255,.78);backdrop-filter:blur(14px);border-radius:16px;padding:14px 20px;font:700 22px/1.35 Inter;color:#1e3a2f;letter-spacing:.3px}
.fade{position:absolute;left:0;right:0;bottom:0;height:260px;background:linear-gradient(transparent,rgba(0,0,0,.42))}
</style></head><body>
<div class="bg"></div>
<div class="note">
 <div class="top"><span class="icon"></span>MESSAGES<span class="t">now</span></div>
 <div class="from">Emma 💛</div>
 <div class="msg">Disney's booked!! 🎉 Please don't sit out day 2 again this time, Mom 🥺</div>
</div>
<div class="cta">This time, keep up →</div>
<div class="offer">40% OFF + FREE SHIPPING<br>30-DAY MONEY-BACK GUARANTEE</div>
</body></html>
