<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;position:relative;font-family:Inter}
.bg{position:absolute;inset:0;background:url(../scenes/park_bg.png) center/cover;transform:scale(1.08)}
.tint{position:absolute;left:0;right:0;top:0;height:380px;background:linear-gradient(rgba(20,30,70,.45),rgba(20,30,70,0))}
h1{position:absolute;left:76px;right:76px;top:108px;text-align:center;font-family:Anton;font-size:70px;line-height:1.06;color:#fff;text-transform:uppercase;text-shadow:0 4px 18px rgba(0,0,0,.4);white-space:nowrap}
.shoes{position:absolute;left:40px;right:40px;top:560px;height:420px}
.shoes img{position:absolute;width:390px;filter:drop-shadow(0 24px 18px rgba(0,0,0,.35))}
.s1{left:0;top:110px}.s2{left:320px;top:150px;z-index:2}.s3{left:640px;top:110px}
.sh{position:absolute;height:44px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.45),transparent 70%)}
.band{position:absolute;left:76px;right:76px;top:985px;background:rgba(255,255,255,.92);border-radius:20px;padding:20px 0;text-align:center;font:900 54px Inter;color:#111;letter-spacing:1px}
.icons{position:absolute;left:76px;right:76px;top:1104px;display:flex;gap:16px}
.icons div{flex:1;background:#0F1730;border-radius:22px;color:#fff;font:800 27px/1.2 Inter;padding:24px 18px;text-align:center;min-height:146px;display:flex;align-items:center;justify-content:center}

<div class="bg"></div><div class="tint"></div>
<h1>Miles of walking. Hours in line.<br>Made for plus-size park days.</h1>
<div class="shoes"><i class="sh" style="left:20px;width:360px;top:335px"></i><i class="sh" style="left:340px;width:360px;top:375px"></i><i class="sh" style="left:660px;width:360px;top:335px"></i><img class="s1" src="../../../reference/cutouts/shoe_black_purple.png"><img class="s2" src="../../../reference/cutouts/shoe_navy_blue.png"><img class="s3" src="../../../reference/cutouts/shoe_red_burgundy.png"></div>
<div class="band">WIDE • STABLE • CUSHIONED</div>
<div class="icons"><div>Wide,<br>stable base</div><div>Room for<br>swollen feet</div><div>Cushion for<br>20,000 steps</div></div>
